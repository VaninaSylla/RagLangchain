[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag_langchain"
version = "0.2.0"
description = "Interactive RAG with LangChain, Chroma, and multi-DB connectors"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain==1.3.13",
    "langchain-community==0.4.2",
    "langchain-ollama==1.1.0",
    "langchain-core",
    "langchain-chroma",
    "chromadb",
    "pymupdf",
    "unstructured",
    "python-docx",
    "sentence-transformers",
    "streamlit",
    "pydantic-settings",
    "python-dotenv",
    "psycopg2-binary",
    "pymongo",
]

[tool.setuptools.packages.find]
where = ["."]
